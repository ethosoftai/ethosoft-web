---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -f dist/index.html dist/robots.txt dist/sitemap.xml dist/llms.txt .htaccess "$DEPLOYPATH"
    - /bin/cp -R -f dist/assets dist/papers dist/works dist/models dist/experiments dist/person public/basarilarimiz public/kisiler public/logolar public/partnerlerimiz "$DEPLOYPATH"
    # Keep newly added paper routes present when cPanel deploys incrementally.
    - /bin/mkdir -p "$DEPLOYPATH/papers/goal-drift" "$DEPLOYPATH/papers/tr-docvqa-synth"
    - /bin/cp -f dist/papers/goal-drift/index.html "$DEPLOYPATH/papers/goal-drift/index.html"
    - /bin/cp -f dist/papers/tr-docvqa-synth/index.html "$DEPLOYPATH/papers/tr-docvqa-synth/index.html"
    - /bin/cp -f dist/papers/tr-docvqa-synth.pdf "$DEPLOYPATH/papers/tr-docvqa-synth.pdf"
    - /bin/chmod 755 "$DEPLOYPATH"
    - /bin/chmod 644 "$DEPLOYPATH/index.html" "$DEPLOYPATH/robots.txt" "$DEPLOYPATH/sitemap.xml" "$DEPLOYPATH/llms.txt" "$DEPLOYPATH/.htaccess"
    - /usr/bin/find "$DEPLOYPATH/assets" "$DEPLOYPATH/papers" "$DEPLOYPATH/works" "$DEPLOYPATH/models" "$DEPLOYPATH/experiments" "$DEPLOYPATH/person" "$DEPLOYPATH/basarilarimiz" "$DEPLOYPATH/kisiler" "$DEPLOYPATH/logolar" "$DEPLOYPATH/partnerlerimiz" -type d -exec /bin/chmod 755 {} \;
    - /usr/bin/find "$DEPLOYPATH/assets" "$DEPLOYPATH/papers" "$DEPLOYPATH/works" "$DEPLOYPATH/models" "$DEPLOYPATH/experiments" "$DEPLOYPATH/person" "$DEPLOYPATH/basarilarimiz" "$DEPLOYPATH/kisiler" "$DEPLOYPATH/logolar" "$DEPLOYPATH/partnerlerimiz" -type f -exec /bin/chmod 644 {} \;
